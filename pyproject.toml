[project]
name = "redfall"
version = "0.1.0"
description = "Autonomous vulnerability discovery and verified repair for TypeScript and Python services"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "gitpython>=3.1",
    "litellm>=1.40",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "redis>=5.0",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "tree-sitter>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.21",
]

[project.optional-dependencies]
# flask/requests boot range/pythonbank, the Python ground-truth target the
# Python-engine tests replay PoCs against.
dev = ["pytest>=8.0", "flask>=3.0", "requests>=2.31"]

[project.scripts]
redfall = "redfall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"redfall.agent" = ["prompts/*.md"]
"redfall.sandbox" = ["images/redfall-sandbox/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
