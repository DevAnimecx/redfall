name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: redfall
          POSTGRES_PASSWORD: redfall
          POSTGRES_DB: redfall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redfall -d redfall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      REDFALL_TEST_DATABASE_URL: postgresql+psycopg://redfall:redfall@127.0.0.1:5432/redfall_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          # vite 8 requires node ^20.19 || >=22.12
          node-version: "22"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e range

      - name: install the range target's node dependencies
        # The dependency test resolves express's *installed* version from
        # range/vulnbank/node_modules — a real artefact, so CI installs it.
        run: |
          cd range/vulnbank
          npm ci --no-audit --no-fund

      - name: build the landing site (prerender check)
        # The landing page must build and prerender from a clean lockfile.
        run: |
          cd site
          npm ci --no-audit --no-fund
          npm run build
          npm run check:seo
          grep -q "What is RedFall?" dist/index.html
          test -f dist/og/landing.png

      - name: SEO, layout, accessibility and Lighthouse gates (real Chrome)
        run: |
          cd site
          node node_modules/vite/bin/vite.js preview --port 4173 --strictPort &
          for i in $(seq 1 40); do curl -sf http://localhost:4173/redfall/ >/dev/null && break; sleep 0.5; done
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          export CHROME_PATH
          node scripts/mobile_check.mjs http://localhost:4173/redfall/
          node scripts/a11y_check.mjs http://localhost:4173/redfall/
          node scripts/docs_check.mjs http://localhost:4173/redfall/
          node scripts/lighthouse_check.mjs http://localhost:4173/redfall/

      - name: no-mock contract (SS1/SS2)
        run: python scripts/check_no_mock.py

      - name: version contract (rule 21)
        run: python scripts/check_version.py

      - name: orphan check (rule 24)
        run: python scripts/check_orphans.py

      - name: clean tree (rule 22)
        run: python scripts/check_clean_tree.py

      - name: recall regression gate
        # A drop below the committed baseline fails the build. A silent recall
        # regression is the failure the bench exists to catch: the engine finds
        # fewer real bugs while every other number still looks healthy.
        # Needs no container runtime and no Postgres.
        run: python scripts/check_recall.py

      - name: tests
        run: python -m pytest tests/ -q

  package:
    # Universal installability: the built wheel is installed on every platform
    # and driven from a directory outside the checkout. Only the tests that
    # need no database run here; the full suite runs in `check`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: build the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist

      - name: install the wheel plus the test runner
        shell: bash
        run: python -m pip install dist/*.whl pytest

      - name: the installed package works outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          redfall --help
          python -c "import importlib.resources as r, redfall; assert (r.files('redfall.validation') / 'harness.mjs').is_file(); print('installed redfall', redfall.__version__)"

      - name: run the POSIX installer (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          REDFALL_HOME: ${{ runner.temp }}/redfall-home
          REDFALL_NO_DOCTOR: "1"
          REDFALL_NO_PIPX: "1"
        run: |
          sh scripts/install.sh
          "$REDFALL_HOME/venv/bin/redfall" --help
          "$REDFALL_HOME/venv/bin/python" -c "import importlib.resources as r; assert (r.files('redfall.validation') / 'harness.mjs').is_file(); print('install.sh: installed package works')"

      - name: run the PowerShell installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          REDFALL_HOME: ${{ runner.temp }}\redfall-home
          REDFALL_NO_DOCTOR: "1"
        run: |
          .\scripts\install.ps1 -NoPath
          & "$env:REDFALL_HOME\venv\Scripts\redfall.exe" --help
          & "$env:REDFALL_HOME\venv\Scripts\python.exe" -c "import importlib.resources as r; assert (r.files('redfall.validation') / 'harness.mjs').is_file(); print('install.ps1: installed package works')"

      - name: installer contract tests (no database)
        run: python -m pytest tests/test_packaging.py tests/test_install_scripts.py -q

  gvisor:
    # The execution path, on every push. `check` runs the full suite, but this
    # host-class has no container runtime, so the suite's sandbox tests skip
    # with a reason. This job installs Docker with the gVisor runsc runtime and
    # runs them un-skipped — which is the difference between the central claim
    # being arguable and being continuously verified.
    #
    # What is asserted here, in order:
    #   1. the gVisor kernel is actually live (`runsc --version`, dmesg probe),
    #      not merely installed — a runtime that registered but cannot start
    #      would otherwise pass by not failing;
    #   2. `redfall doctor` reports the sandbox present;
    #   3. the sandbox tests execute for real (the skip-count is asserted at
    #      zero rather than assumed);
    #   4. a full vulnerable target boots and a real PoC reproduces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: install Docker (runner image ships it)
        run: docker version

      - name: install gVisor
        # The individual runsc binaries are no longer published on the storage
        # bucket; the release ships as a tarball on GitHub. The tag is resolved
        # from the latest release rather than pinned, and the checksum is
        # verified against the release's own SHA512SUMS so a tampered or
        # truncated download fails here rather than mid-suite.
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/google/gvisor/releases/latest | python -c "import sys, json; print(json.load(sys.stdin)['tag_name'])")
          echo "gVisor release: $TAG"
          curl -fsSL -o /tmp/gvisor-x86_64.tar.bz2 "https://github.com/google/gvisor/releases/download/${TAG}/gvisor-x86_64.tar.bz2"
          curl -fsSL -o /tmp/SHA512SUMS "https://github.com/google/gvisor/releases/download/${TAG}/SHA512SUMS"
          # The SUMS file names its own asset, so the downloaded file must
          # carry the same name for `sha512sum -c` to find it.
          (cd /tmp && grep " gvisor-x86_64.tar.bz2\$" SHA512SUMS | sha512sum -c -)
          # The release tarball carries runsc plus the binaries the
          # Sentry needs at container start (gvisor_sentry among them).
          # Extracting only runsc registers a runtime that cannot start
          # a container — which is precisely what the live-kernel assert
          # below exists to catch.
          sudo tar -xjf /tmp/gvisor-x86_64.tar.bz2 -C /usr/local/bin
          sudo chmod +x /usr/local/bin/runsc
          /usr/local/bin/runsc --version
          # Register the runtime with Docker and restart the daemon. The
          # runner's own storage drivers are unaffected; only the runtime map
          # changes, so the check job's Postgres service is untouched.
          printf '{"runtimes": {"runsc": {"path": "/usr/local/bin/runsc"}}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: assert the gVisor kernel is live, not merely registered
        run: |
          /usr/local/bin/runsc --version
          docker info --format '{{json .Runtimes}}' | grep -q runsc
          # A real container must actually boot on runsc. If the runtime
          # registered but the kernel cannot start, this fails here rather than
          # as a mysterious sandbox failure mid-suite.
          docker run --rm --runtime=runsc busybox:latest echo gvisor-kernel-live

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e range

      - name: install the range target's node dependencies
        run: |
          cd range/vulnbank
          npm ci --no-audit --no-fund

      - name: build the sandbox image
        run: docker build -t redfall-sandbox:latest src/redfall/sandbox/images/redfall-sandbox

      - name: doctor reports the sandbox present
        run: redfall doctor | grep -A2 "Sandbox runtime"

      - name: the sandbox tests execute un-skipped
        run: |
          python -m pytest tests/test_sandbox.py -q 2>&1 | tee /tmp/sandbox.log
          # A skip here is a silent regression: the runtime exists, so nothing
          # in this suite is allowed to skip. Assert rather than assume.
          ! grep -Eq "[0-9]+ skipped" /tmp/sandbox.log

      - name: the execution tests execute un-skipped
        run: |
          python -m pytest tests/test_sandbox.py tests/test_harness_chain.py tests/test_pythonbank.py -q 2>&1 | tee /tmp/exec.log
          ! grep -Eq "[1-9][0-9]* skipped" /tmp/exec.log

      - name: a real command executes inside the gVisor kernel
        # The un-skipped suite above includes the tests that boot a container
        # on runsc, verify it is unprivileged, and confirm execution happened
        # in the Sentry kernel rather than the host. This step is the same
        # path one command wide, so a failure here is readable on its own.
        run: |
          docker run --rm --runtime=runsc \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            redfall-sandbox:latest \
            node -e "console.log('executed on', require('os').platform(), 'inside gVisor')"
