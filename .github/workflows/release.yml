name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: checksums
        run: cd dist && sha256sum redfall-* > SHA256SUMS

      - name: prove the wheel works outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          redfall --help
          python -c "import importlib.metadata, importlib.resources as r; print('installed redfall', importlib.metadata.version('redfall')); assert (r.files('redfall.validation') / 'harness.mjs').is_file()"

      - name: attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/redfall-*.whl
            dist/redfall-*.tar.gz
            dist/SHA256SUMS

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/redfall-*.whl dist/redfall-*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              dist/redfall-*.whl dist/redfall-*.tar.gz dist/SHA256SUMS \
              --title "Redfall $tag" --generate-notes
          fi
