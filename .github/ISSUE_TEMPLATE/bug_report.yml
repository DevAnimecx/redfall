name: Bug report
description: Something in Redfall behaved wrong, crashed, or claimed something it could not prove.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not use this form for security issues in Redfall itself —
        see [SECURITY.md](https://github.com/DevAnimecx/redfall/blob/main/SECURITY.md)
        and use private vulnerability reporting instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, what did you get?
      placeholder: |
        Command: redfall scan range/vulnbank
        Expected: ...
        Got: ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `redfall doctor`
      description: This tells us exactly which prerequisites your host satisfies.
      render: text
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback / raw output
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `redfall --version`, or the commit if running from source.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python
      placeholder: "Windows 11, Python 3.13.1"
    validations:
      required: true
