[project]
name = "range-runner"
version = "0.2.0"
description = "Deterministic the baseline release gate scorer for the Redfall vulnerability range"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
range-runner = "range_runner.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["range_runner"]
