services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnbank
      POSTGRES_PASSWORD: Sup3rS3cretBankPwd!
      POSTGRES_DB: vulnbank
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnbank -d vulnbank"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: vulnbank
      DB_USER: vulnbank
      DATABASE_URL: postgresql://vulnbank:Sup3rS3cretBankPwd!@db:5432/vulnbank
      UPLOAD_DIR: /app/uploads
      SEED_ON_BOOT: "true"
    ports:
      - "4000:4000"
