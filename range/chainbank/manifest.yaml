scoring:
  chain_recall_target: '>= 5 of 6'
  chain_recall_definition: A chain counts as recalled when every one of its findings is reported and the
    reported set contains at least two finding ids that the report joins into one path.
  cvss_compound_note: 'cvss_compound is the expected combined severity for the chain. A report that scores
    a chain below its worst single step is wrong: chaining can add risk but cannot remove it.'
